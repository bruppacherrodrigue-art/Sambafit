services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rotation
      POSTGRES_PASSWORD: rotation
      POSTGRES_DB: rotation
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - rotation_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rotation -d rotation"]
      interval: 2s
      timeout: 2s
      retries: 15
  api:
    profiles: [app]
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql://rotation:rotation@db:5432/rotation
      ROTATION_MODE: DEMO
      ROTATION_KILL_SWITCH: "1"
    ports:
      - "127.0.0.1:8008:8008"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "uv run --no-sync rotation demo-seed && uv run --no-sync uvicorn rotation.api:app --host 0.0.0.0 --port 8008"]
  web:
    profiles: [app]
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://api:8008
    ports:
      - "127.0.0.1:5173:5173"
    depends_on: [api]
volumes:
  rotation_pg:
